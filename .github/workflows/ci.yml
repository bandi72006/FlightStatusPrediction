name: Build to Docker Hub whenever committing 

on:
    push:
        branches: [main]

jobs:
    buildAndPush:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx # Docker builder that supports multi-platform builds
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secerts.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                file: ./dockerfile
                push: true
                tags: bandi72006/flightPred-fastapi:latest